spring:
  application.name: core-platform-runtime
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/core_platform}
    username: ${DB_USER:core_app}
    password: ${DB_PASSWORD:core_app_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
  flyway:
    enabled: true
    schemas: public
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  shutdown: graceful
  error.include-message: never
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
  health.readinessstate.enabled: true
  health.livenessstate.enabled: true
springdoc.swagger-ui.path: /swagger-ui
core:
  bootstrap-admin-password: ${CORE_BOOTSTRAP_ADMIN_PASSWORD:}
  bootstrap-mfa-code: ${CORE_BOOTSTRAP_MFA_CODE:}
  file-storage-root: ${FILE_STORAGE_ROOT:/data/files}
