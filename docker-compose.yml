services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: core_platform
      POSTGRES_USER: core_app
      POSTGRES_PASSWORD: core_app_dev
    ports: ["5432:5432"]
    volumes: ["core_pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U core_app -d core_platform"], interval: 5s, timeout: 3s, retries: 20}
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/core_platform
      DB_USER: core_app
      DB_PASSWORD: core_app_dev
      SPRING_PROFILES_ACTIVE: demo
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"], interval: 10s, timeout: 3s, retries: 12}
volumes: {core_pgdata: {}}
